name: Android APK release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with: { name: musicman-apks, path: build/app/outputs/flutter-apk/*-release.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: build/app/outputs/flutter-apk/*-release.apk, generate_release_notes: true }
