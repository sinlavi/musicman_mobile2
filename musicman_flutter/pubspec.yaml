name: musicman
description: MusicMan - A full-featured music player with offline downloads, lyrics, playlists, and more
version: 6.8.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  
  # Audio Playback
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.9
  audio_session: ^0.1.22
  media_session: ^0.1.9
  
  # Local Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  hydrated_bloc: ^9.1.5
  
  # Background Tasks
  workmanager: ^0.5.2
  flutter_downloader: ^1.11.1
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  
  # Utilities
  intl: ^0.19.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.2.6
  share_plus: ^10.0.2
  path: ^1.9.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  collection: ^1.18.0
  rxdart: ^0.27.7
  
  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  pull_to_refresh: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  marquee: ^2.3.0
  
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  custom_lint: ^0.6.6
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/